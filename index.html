<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Required, not leftover: src/admin/MasterDashboard/components/FormTemas.jsx
         lets a teacher type ANY Tailwind class string (including arbitrary
         hex colors) into the seasonal theme's header gradient field — no
         finite build-time safelist (see src/index.css) can cover every
         value an admin might type. This CDN build's runtime scanner is
         what actually covers that free-text case; removing it (as an
         earlier pass here did) breaks any theme whose header class isn't
         already in the static safelist. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Spanish Gym</title>

    <!-- Installable / full-screen "app" behavior on phones -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spanish Gym" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
